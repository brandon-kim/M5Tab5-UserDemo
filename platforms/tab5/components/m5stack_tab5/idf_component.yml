
version: "1.3.2"
description: Board Support Package (BSP) for M5Stack Tab5
url: https://github.com/espressif/esp-bsp/tree/master/bsp/m5stack_tab5

targets:
  - esp32p4

tags:
  - bsp
  - M5Stack

dependencies:
  idf: ">=5.4"

  espressif/esp_codec_dev:
    version: "~1.5"
    public: true

  espressif/esp_io_expander:
    version: "*"
    public:  true
#    override_path: "../io_expander/esp_io_expander"
  
  espressif/esp_io_expander_pi4ioe5v6408:
    version: "*"
    public: true
#    override_path: "../io_expander/esp_io_expander_pi4ioe5v6408"

  espressif/esp_lvgl_port:
    #version: "^2" #  error: 'esp_lcd_dpi_panel_event_callbacks_t' has no member named 'on_frame_buf_complete'
    version: 2.9.0
    public: true
    override_path: ../esp_lvgl_port

  espressif/esp_lcd_st7123:
    version: "*"
    public: true

  espressif/esp_lcd_ili9881c:
    version: "*"
    public: true
#    override_path: "../../components/lcd/esp_lcd_ili9881c"

  espressif/esp_lcd_touch_st7123:
    version: "*"
    public: true

  espressif/esp_lcd_touch_gt911:
    version: "*"
    public: true
    # Here cannot be override_path, because we are using two touch comonents.
    # The ST7123 is not owned by BSP and loading another version of esp_lcd_touch

  #espressif/esp_video: ">=2.0,<2.4" # 2.4.0 fails to compile against the CI IDF (ISP_LL_EVENT_ERROR_MASK undeclared) 
  espressif/esp_video: 
    version: ^2.5
    public: true

# usb host support  
  espressif/usb:
    version: "^1"
    public: true

#  espressif/bmi270:
#    version: '*'
#    public: true
#    override_path: ../../components/sensors/bmi270

  sensor_bmi270:
     public: true
     path: ../sensor_bmi270
